<div class="min-h-screen bg-stone-100 p-8">
    <div class="max-w-6xl mx-auto">
        
        <div class="flex justify-between items-center mb-10 border-b-2 border-emerald-900 pb-4">
            <div>
                <h1 class="text-4xl font-serif text-emerald-900">Visão Geral</h1>
                <p class="text-stone-500 font-semibold mt-2 tracking-wide uppercase text-sm">
                    Painel de Controle do Heimdall
                </p>
            </div>
            
            <button (click)="logout()"
                class="flex items-center gap-2 bg-stone-50 hover:bg-red-50 text-amber-900 hover:text-red-700 px-4 py-2 border border-stone-200 hover:border-red-200 font-bold uppercase tracking-wider text-xs transition-all rounded-sm shadow-sm">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Sair do Sistema
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-in fade-in slide-in-from-bottom-4 duration-500">

            <div routerLink="/book"
                class="bg-stone-50 p-6 rounded-sm border border-emerald-900/10 shadow-sm flex items-center justify-between cursor-pointer hover:shadow-md hover:border-emerald-900 focus:ring-2 focus:ring-emerald-900 outline-none transition-all group">
                <div>
                    <p class="text-xs font-bold text-stone-500 uppercase tracking-widest group-hover:text-emerald-900 transition-colors">
                        Acervo de Livros
                    </p>
                    <h3 class="text-4xl font-serif text-emerald-900 mt-1">{{ totalBooks }}</h3>
                </div>
                <div class="w-14 h-14 rounded bg-emerald-900/10 flex items-center justify-center text-emerald-900 group-hover:bg-emerald-900 group-hover:text-stone-50 transition-colors">
                    <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
                        <path d="M6 6h10" />
                        <path d="M6 10h10" />
                    </svg>
                </div>
            </div>

            <div routerLink="/author"
                class="bg-stone-50 p-6 rounded-sm border border-emerald-900/10 shadow-sm flex items-center justify-between cursor-pointer hover:shadow-md hover:border-emerald-900 focus:ring-2 focus:ring-emerald-900 outline-none transition-all group">
                <div>
                    <p class="text-xs font-bold text-stone-500 uppercase tracking-widest group-hover:text-emerald-900 transition-colors">
                        Autores
                    </p>
                    <h3 class="text-4xl font-serif text-emerald-900 mt-1">{{ totalAuthors }}</h3>
                </div>
                <div class="w-14 h-14 rounded bg-emerald-900/10 flex items-center justify-center text-emerald-900 group-hover:bg-emerald-900 group-hover:text-stone-50 transition-colors">
                    <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </div>
            </div>

            <div routerLink="/user"
                class="bg-stone-50 p-6 rounded-sm border border-emerald-900/10 shadow-sm flex items-center justify-between cursor-pointer hover:shadow-md hover:border-emerald-900 focus:ring-2 focus:ring-emerald-900 outline-none transition-all group">
                <div>
                    <p class="text-xs font-bold text-stone-500 uppercase tracking-widest group-hover:text-emerald-900 transition-colors">
                        Usuários
                    </p>
                    <h3 class="text-4xl font-serif text-emerald-900 mt-1">{{ totalUsers }}</h3>
                </div>
                <div class="w-14 h-14 rounded bg-emerald-900/10 flex items-center justify-center text-emerald-900 group-hover:bg-emerald-900 group-hover:text-stone-50 transition-colors">
                    <svg class="w-7 h-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" />
                        <path d="M12 8v8" />
                        <path d="M8 12h8" />
                    </svg>
                </div>
            </div>

        </div>
    </div>
</div>
