<div class="h-screen w-full flex items-center justify-center bg-[#EFE8D8] p-6">
  
  <div class="w-full max-w-md bg-white rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden border border-gray-100">
    
    <div class="bg-[#1B3022] p-10 text-center">
      <h2 class="text-3xl font-bold text-[#EFE8D8] tracking-tight">Via Appia</h2>
      <p class="text-[#A67C00] uppercase text-xs tracking-[0.2em] mt-3 font-semibold">Sistema de Gestão</p>
    </div>

    <form (submit)="onLogin()" class="p-8 space-y-6">
      <div>
        <label class="block text-[11px] font-bold text-[#4A4E4D] uppercase tracking-widest mb-2">Usuário</label>
        <input type="text" [(ngModel)]="credentials.login" name="login" 
               class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-[#5D4037]/20 focus:border-[#5D4037] transition-all"
               placeholder="admin">
      </div>
      
      <div>
        <label class="block text-[11px] font-bold text-[#4A4E4D] uppercase tracking-widest mb-2">Senha</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" 
               class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-[#5D4037]/20 focus:border-[#5D4037] transition-all"
               placeholder="••••••">
      </div>
      
      <button type="submit" 
              class="w-full bg-[#5D4037] text-white py-4 rounded-lg font-bold uppercase tracking-widest hover:bg-[#1B3022] transition-all duration-300 shadow-lg active:scale-[0.98]">
        Entrar
      </button>
    </form>
  </div>
</div>
