<div *ngIf="toast$ | async as toast">
  <div *ngIf="toast.show" 
       class="fixed top-5 right-5 z-50 max-w-sm w-full bg-stone-50 border rounded-lg shadow-xl transition-all duration-300 animate-in slide-in-from-top-5"
       [class.border-emerald-500]="toast.type === 'success'"
       [class.border-red-500]="toast.type === 'error'"
       [class.border-amber-500]="toast.type === 'warning'"> <div class="p-4 flex items-center gap-3">
      <div *ngIf="toast.type === 'success'" class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      
      <div *ngIf="toast.type === 'error'" class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-600">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>

      <div *ngIf="toast.type === 'warning'" class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>

      <div class="flex-1">
        <p class="text-sm font-semibold text-stone-800">{{ toast.message }}</p>
      </div>

      <button (click)="notificationService.hide()" class="text-stone-400 hover:text-stone-600 text-lg">&times;</button>
    </div>
  </div>
</div>
