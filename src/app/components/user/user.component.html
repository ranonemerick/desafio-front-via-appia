<div class="min-h-screen bg-stone-100 p-8">
    <div class="max-w-6xl mx-auto">

        <div class="flex justify-between items-end mb-8 border-b-2 border-emerald-900 pb-4">
            <div class="flex items-center gap-4">
                <button routerLink="/dashboard"
                    class="p-2 text-emerald-900 hover:bg-emerald-900/10 rounded transition-colors"
                    title="Voltar ao Painel">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                </button>
                <h1 class="text-4xl font-serif text-emerald-900">Gestão de Usuários</h1>
            </div>
            <button
                (click)="resetForm(); isFormVisible = true"
                class="bg-amber-900 text-stone-100 px-6 py-2 font-bold uppercase tracking-widest hover:bg-emerald-900 transition-all rounded-sm shadow-sm">
                Novo Usuário
            </button>
        </div>

        <div class="bg-stone-50 p-6 mb-8 border border-emerald-900/10 rounded-sm shadow-sm">
            <div class="flex justify-between items-center mb-6">
                <div class="relative w-full max-w-sm">
                    <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" 
                        placeholder="Buscar usuário..." 
                        class="w-full pl-10 pr-4 py-2 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all shadow-sm text-stone-600">
                </div>

                <button class="flex items-center gap-2 px-4 py-2 bg-white border border-stone-300 rounded text-stone-700 font-bold text-sm hover:bg-stone-50 transition-colors shadow-sm">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                    </svg>
                    Filtros
                </button>
            </div>

            <table class="w-full text-left border-collapse">
                <thead class="bg-emerald-900 text-stone-100">
                    <tr>
                        <th class="p-4 font-bold uppercase text-xs tracking-wider">Nome / Login</th>
                        <th class="p-4 font-bold uppercase text-xs tracking-wider">E-mail</th>
                        <th class="p-4 font-bold uppercase text-xs tracking-wider">Perfil</th>
                        <th class="p-4 font-bold uppercase text-xs tracking-wider text-right">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-stone-200">
                    <tr *ngFor="let user of users" class="hover:bg-stone-50 transition-colors">
                        <td class="p-4 text-emerald-900">
                            <span class="font-semibold block">{{ user.name }}</span>
                            <span class="text-xs text-stone-500">{{ user.login }}</span>
                        </td>
                        <td class="p-4 text-stone-600">{{ user.email }}</td>
                        <td class="p-4 text-stone-600">
                            <span class="px-2 py-1 bg-stone-200 text-stone-700 text-xs font-bold rounded-sm uppercase">{{ user.role }}</span>
                        </td>
                        <td class="p-4 text-right flex justify-end gap-4">
                            <button type="button" class="text-amber-900 hover:text-emerald-900 font-bold underline text-sm transition-colors">Editar</button>
                            <button type="button" class="text-red-700 hover:text-red-900 font-bold underline text-sm transition-colors">Excluir</button>
                        </td>
                    </tr>

                    <tr *ngIf="users.length === 0">
                        <td colspan="4" class="p-8 text-center text-stone-500 font-medium">Nenhum usuário listado. (Backend GET pendente)</td>
                    </tr>
                    <tr *ngFor="let i of [].constructor(users.length === 0 ? 9 : 10 - users.length)" class="hidden md:table-row">
                        <td colspan="4" class="p-4">&nbsp;</td>
                    </tr>
                </tbody>
            </table>

            <div class="flex justify-center items-center gap-4 p-6 bg-stone-50 border-t border-emerald-900/10">
                <button disabled class="px-4 py-2 bg-emerald-900 text-stone-100 disabled:opacity-50 rounded-sm">Anterior</button>
                <span class="text-emerald-900 font-bold">Página 1 de 1</span>
                <button disabled class="px-4 py-2 bg-emerald-900 text-stone-100 disabled:opacity-50 rounded-sm">Próximo</button>
            </div>
        </div>
    </div>
</div>

<div *ngIf="isFormVisible" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div (click)="resetForm()" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm transition-opacity"></div>

    <div class="relative bg-stone-50 w-full max-w-lg rounded-lg shadow-2xl border border-emerald-900/20 overflow-hidden animate-in zoom-in-95 duration-200">
        <div class="bg-emerald-900 p-4 flex justify-between items-center">
            <h2 class="text-stone-100 font-serif text-xl">Novo Usuário</h2>
            <button (click)="resetForm()" class="text-stone-100/70 hover:text-stone-100 text-2xl transition-colors">&times;</button>
        </div>

        <div class="p-6 flex flex-col gap-5">
            <div class="flex gap-4">
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase tracking-tighter">Nome Completo <span class="text-red-500">*</span></label>
                    <input type="text" [(ngModel)]="newUser.name" name="name" autocomplete="off" placeholder="Ex: Admin Sistema" 
                        class="w-full p-3 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all">
                </div>
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase tracking-tighter">Login <span class="text-red-500">*</span></label>
                    <input type="text" [(ngModel)]="newUser.login" name="login" autocomplete="off" placeholder="Ex: admin_01" 
                        class="w-full p-3 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all">
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-xs font-bold text-emerald-900 uppercase tracking-tighter">E-mail Corporativo <span class="text-red-500">*</span></label>
                <input type="email" [(ngModel)]="newUser.email" name="email" autocomplete="off" placeholder="Ex: contato@empresa.com" 
                    class="w-full p-3 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all">
            </div>

            <div class="flex gap-4">
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase tracking-tighter">Senha <span class="text-red-500">*</span></label>
                    <input type="password" [(ngModel)]="newUser.password" name="password" placeholder="••••••••" 
                        class="w-full p-3 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all">
                </div>
                <div class="flex flex-col gap-1 flex-1">
                    <label class="text-xs font-bold text-emerald-900 uppercase tracking-tighter">Perfil (Role) <span class="text-red-500">*</span></label>
                    <select [(ngModel)]="newUser.role" name="role" 
                        class="w-full p-3 bg-white border border-stone-300 rounded focus:ring-2 focus:ring-emerald-900 outline-none transition-all text-stone-700">
                        <option value="USER">Comum (USER)</option>
                        <option value="ADMIN">Administrador (ADMIN)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-4">
                <button (click)="resetForm()" 
                    class="flex-1 px-4 py-3 border border-stone-300 text-stone-600 font-bold rounded hover:bg-stone-100 transition-all">
                    Cancelar
                </button>
                <button (click)="createNewUser()" 
                    [disabled]="!newUser.name || !newUser.login || !newUser.email || !newUser.password"
                    class="flex-1 px-4 py-3 bg-emerald-900 text-stone-100 font-bold rounded hover:bg-emerald-800 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-emerald-900 shadow-md transition-all">
                    Salvar
                </button>
            </div>
        </div>
    </div>
</div>

<app-confirm-modal 
    [isVisible]="isConfirmModalVisible" 
    title="Excluir Usuário"
    message="Tem certeza que deseja inativar ou remover o acesso deste usuário?"
    (cancelled)="closeConfirmModal()">
</app-confirm-modal>
